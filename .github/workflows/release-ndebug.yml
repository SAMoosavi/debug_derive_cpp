name: Release NDEBUG

on: [push, pull_request]

jobs:
  release-ndebug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure Release
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
      - name: Build debug_auto_private
        run: cmake --build build/release --target debug_auto_private
      - name: Verify Release fallback (Type {})
        run: ./build/release/debug_auto_private --gtest_filter='DebugDeriveAutoPrivate.ReleaseFallbackDocumentsNoOp'
